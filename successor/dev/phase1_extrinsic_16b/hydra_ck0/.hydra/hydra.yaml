hydra:
  run:
    dir: /home/master/llm_projects/philosophia/successor/dev/phase1_extrinsic_16b/hydra_ck0
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/home/master/llm_projects/philosophia/successor/dev/phase1_extrinsic_16b/hydra_ck0
    - hydra.mode=RUN
    task:
    - task=eval
    - problemset=kleene
    - agent=mcts-lm
    - agent.max_mcts_nodes=8000
    - agent.node_type=holophrasm
    - accumulate_library=false
    - +seed=0
    - +agent_path=/home/master/llm_projects/minimo/learning/outputs/2026-08-10/00-14-33/0.pt
    - job.wandb_project=null
    - +results_path=/home/master/llm_projects/philosophia/successor/dev/phase1_extrinsic_16b/checkpoint_0.json
  job:
    name: proofsearch
    chdir: true
    override_dirname: +agent_path=/home/master/llm_projects/minimo/learning/outputs/2026-08-10/00-14-33/0.pt,+results_path=/home/master/llm_projects/philosophia/successor/dev/phase1_extrinsic_16b/checkpoint_0.json,+seed=0,accumulate_library=false,agent.max_mcts_nodes=8000,agent.node_type=holophrasm,agent=mcts-lm,job.wandb_project=null,problemset=kleene,task=eval
    id: ???
    num: ???
    config_name: proofsearch
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.5
    version_base: '1.2'
    cwd: /home/master/llm_projects/minimo/learning
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /home/master/llm_projects/minimo/learning/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /home/master/llm_projects/philosophia/successor/dev/phase1_extrinsic_16b/hydra_ck0
    choices:
      agent: mcts-lm
      agent/curiosity: constant
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
